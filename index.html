<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIDORI — Reality-to-World Engine</title>
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; background: #0a0e14; }
      #app { width: 100vw; height: 100vh; }
      canvas { display: block; }
      #hud {
        position: fixed; left: 12px; bottom: 12px;
        font: 12px/1.5 -apple-system, "Segoe UI", sans-serif;
        color: #d7dee8; background: rgba(10,14,20,0.55);
        padding: 8px 10px; border-radius: 4px; pointer-events: none;
        user-select: none;
      }
      #crosshair {
        position: fixed; left: 50%; top: 50%; width: 6px; height: 6px;
        margin: -3px 0 0 -3px; border-radius: 50%;
        background: rgba(255,255,255,0.7); pointer-events: none;
      }
      #blocker {
        position: fixed; inset: 0; background: rgba(5,7,10,0.75);
        display: flex; align-items: center; justify-content: center;
        color: #e8edf4; font: 15px/1.6 -apple-system, "Segoe UI", sans-serif;
        text-align: center; cursor: pointer;
      }
      #blocker.hidden { display: none; }
      #debug {
        position: fixed; right: 12px; top: 12px;
        max-width: min(560px, 44vw); max-height: 90vh; overflow: auto;
        font: 11px/1.5 ui-monospace, monospace;
        color: #9be79b; background: rgba(10,14,20,0.6);
        padding: 8px 10px; border-radius: 4px; white-space: pre-wrap;
        word-break: break-word; pointer-events: none; display: none;
      }
      #debug.visible { display: block; }
      /* Directive 06 §3 / 07 §2: touch controls, shown only on touch devices (main.ts toggles this class) */
      #joystick {
        position: fixed; left: max(18px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom));
        width: 108px; height: 108px; border-radius: 50%;
        background: rgba(20,27,25,0.55); border: 1px solid rgba(255,255,255,0.15);
        display: none; touch-action: none; z-index: 5; perspective: 220px;
      }
      /* Directive 07 §2: fixed marks on the base — the top chevron is the
         forward reference (forward = the camera's current heading, not a
         fixed compass direction), the side ticks just confirm the axes. */
      #joystick::before {
        content: "▲"; position: absolute; left: 50%; top: 6px;
        transform: translateX(-50%); font-size: 10px; color: rgba(255,255,255,0.45);
      }
      #joystick .tick {
        position: absolute; width: 3px; height: 3px; border-radius: 50%;
        background: rgba(255,255,255,0.35);
      }
      #joystick .tick.left { left: 6px; top: 50%; margin-top: -1.5px; }
      #joystick .tick.right { right: 6px; top: 50%; margin-top: -1.5px; }
      #joystick .tick.bottom { left: 50%; bottom: 6px; margin-left: -1.5px; }
      #joystick .rod {
        position: absolute; left: 50%; top: 50%; height: 4px; width: 0;
        margin-top: -2px; transform-origin: left center; border-radius: 2px;
        background: rgba(217,164,65,0.55); opacity: 0; pointer-events: none;
      }
      #joystick .knob {
        position: absolute; left: 50%; top: 50%; width: 44px; height: 44px;
        margin: -22px 0 0 -22px; border-radius: 50%;
        background: rgba(217,164,65,0.85); box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        transform-style: preserve-3d;
      }
      #debugToggleTouch {
        position: fixed; right: max(12px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top));
        display: none; z-index: 5; background: rgba(10,14,20,0.6); color: #d7dee8;
        border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 8px 12px;
        font: 600 11px/1 ui-monospace, monospace;
      }
      body.touch-controls #joystick,
      body.touch-controls #debugToggleTouch { display: block; }
      body.touch-controls #hud { display: none; }
      /* Directive 07 §1: settings toggle, usable on both touch and desktop
         (desktop must exit pointer lock first — Esc — since the mouse
         cursor is captured while locked). Kept out of the way, top-left. */
      #settingsToggle {
        position: fixed; left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top));
        z-index: 6; background: rgba(10,14,20,0.6); color: #d7dee8;
        border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 6px 10px;
        font: 600 11px/1 ui-monospace, monospace; cursor: pointer;
      }
      #settingsPanel {
        position: fixed; left: max(12px, env(safe-area-inset-left)); top: calc(max(12px, env(safe-area-inset-top)) + 34px);
        z-index: 6; background: rgba(10,14,20,0.85); color: #d7dee8;
        border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; padding: 10px 12px;
        font: 12px/1.8 -apple-system, "Segoe UI", sans-serif; display: none;
      }
      #settingsPanel.open { display: block; }
      #settingsPanel label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
      /* Directive 07 §4: minimal one-time operation hint, auto-fades. */
      #hint {
        position: fixed; left: 50%; bottom: 140px; transform: translateX(-50%);
        z-index: 6; background: rgba(10,14,20,0.7); color: #e8edf4;
        border-radius: 6px; padding: 8px 14px; font: 13px/1.5 -apple-system, "Segoe UI", sans-serif;
        text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.6s ease;
        max-width: 80vw;
      }
      #hint.visible { opacity: 1; pointer-events: auto; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="crosshair"></div>
    <div id="hud">W A S D 移動 &nbsp;/&nbsp; マウス 視点 &nbsp;/&nbsp; F1 デバッグ表示</div>
    <div id="debug"></div>
    <div id="joystick">
      <div class="tick left"></div><div class="tick right"></div><div class="tick bottom"></div>
      <div class="rod"></div>
      <div class="knob"></div>
    </div>
    <button id="debugToggleTouch" type="button">DEBUG</button>
    <button id="settingsToggle" type="button">⚙ 設定</button>
    <div id="settingsPanel">
      <label><input type="checkbox" id="invertXToggle" /> 横方向：つかんで引く操作（既定）</label>
      <label><input type="checkbox" id="invertYToggle" /> 縦方向：つかんで引く操作（既定）</label>
    </div>
    <div id="hint"></div>
    <div id="blocker">クリック / タップして開始<br /><span style="font-size:12px;opacity:0.7">2010-05-30 北海道斜里郡清里町・緑</span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
