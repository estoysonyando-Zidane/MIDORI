<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIDORI — Spatial Index Map</title>
    <style>
      :root {
        --bg: #0a0e14; --panel: #141b19; --panel-border: #26332f;
        --ink: #e9efec; --ink-dim: #93a29c;
        --defined: #4a9b8f; --stub: #d9a441; --undefined: #4b5a63;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
        font: 14px/1.5 -apple-system, "Hiragino Sans", "Segoe UI", sans-serif; overflow: hidden; }
      #canvasWrap { position: fixed; inset: 0; cursor: grab; }
      #canvasWrap.dragging { cursor: grabbing; }
      svg { width: 100%; height: 100%; display: block; }
      .entity-line { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke; }
      .entity-poly { stroke-width: 1.5; fill-opacity: 0.18; vector-effect: non-scaling-stroke; }
      .entity-point { stroke-width: 1.5; vector-effect: non-scaling-stroke; cursor: pointer; }
      .entity-point:hover, .entity-line:hover, .entity-poly:hover { filter: brightness(1.5); }
      .entity-label { font: 11px/1 ui-monospace, monospace; fill: var(--ink-dim); pointer-events: none; }

      #hud {
        position: fixed; left: 16px; top: 16px; max-width: 320px;
        background: rgba(20, 27, 25, 0.82); border: 1px solid var(--panel-border);
        border-radius: 6px; padding: 14px 16px;
      }
      #hud h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
      #hud .sub { color: var(--ink-dim); font-size: 12px; margin-bottom: 10px; }
      .legend-row { display: flex; align-items: center; gap: 8px; font-size: 12px; margin: 4px 0; }
      .legend-swatch { width: 16px; height: 3px; flex: none; }
      .legend-swatch.dot { width: 9px; height: 9px; border-radius: 50%; }
      .legend-swatch.defined { background: var(--defined); }
      .legend-swatch.stub { background: var(--stub); border-top: 2px dashed var(--stub); background: none; height: 0; }
      .legend-swatch.undefinedstat { background: none; height: 0; border-top: 2px dotted var(--undefined); }
      #stats { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--panel-border);
        color: var(--ink-dim); font: 11px/1.6 ui-monospace, monospace; white-space: pre-wrap; }

      #inspector {
        position: fixed; right: 0; top: 0; bottom: 0; width: 340px;
        background: rgba(20, 27, 25, 0.94); border-left: 1px solid var(--panel-border);
        padding: 18px 18px; overflow-y: auto; transform: translateX(100%);
        transition: transform 0.2s ease;
      }
      #inspector.open { transform: translateX(0); }
      #inspector h2 { margin: 0 0 2px; font-size: 15px; }
      #inspector .cat { color: var(--ink-dim); font-size: 12px; margin-bottom: 14px; }
      #inspector dl { margin: 0; font-size: 12px; }
      #inspector dt { color: var(--ink-dim); margin-top: 10px; }
      #inspector dd { margin: 2px 0 0; font: 12px/1.5 ui-monospace, monospace; word-break: break-word; }
      #inspector .frontier-badge {
        display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px;
        font-weight: 600; margin-top: 4px;
      }
      #inspector .frontier-badge.defined { background: rgba(74,155,143,0.25); color: var(--defined); }
      #inspector .frontier-badge.stub { background: rgba(217,164,65,0.2); color: var(--stub); }
      #inspector .frontier-badge.undefined { background: rgba(75,90,99,0.3); color: var(--ink-dim); }
      #inspectorClose {
        position: absolute; right: 14px; top: 14px; background: none; border: none;
        color: var(--ink-dim); font-size: 18px; cursor: pointer; line-height: 1;
      }

      #zoomHint { position: fixed; left: 16px; bottom: 16px; color: var(--ink-dim); font-size: 11px; }
      a.back-link { color: var(--defined); text-decoration: none; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="canvasWrap">
      <svg id="mapSvg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div id="hud">
      <h1>Spatial Index — JP.01.546.MIDORI</h1>
      <div class="sub">緑町 / 位置と同一性のみ（詳細は3D World側）</div>
      <div class="legend-row"><span class="legend-swatch defined"></span> defined（実装済み）</div>
      <div class="legend-row"><span class="legend-swatch stub"></span> stub（位置のみ登録）</div>
      <div class="legend-row"><span class="legend-swatch undefinedstat"></span> undefined（未登録領域）</div>
      <div id="stats">loading…</div>
      <div style="margin-top:10px"><a class="back-link" href="./">← 3D World に戻る</a></div>
    </div>
    <div id="inspector">
      <button id="inspectorClose" type="button" aria-label="close">×</button>
      <h2 id="inspTitle"></h2>
      <div class="cat" id="inspCat"></div>
      <span class="frontier-badge" id="inspBadge"></span>
      <dl id="inspFields"></dl>
    </div>
    <div id="zoomHint">ドラッグでパン ／ ホイールでズーム ／ クリックで詳細</div>
    <script type="module" src="/src/map/main.ts"></script>
  </body>
</html>
